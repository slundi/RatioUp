[package]
name = "RatioUp"
authors = ["slundi"]
version = "1.4.1"
edition = "2024"
homepage = "https://codeberg.org/slundi/RatioUp"
keywords = ["torrent", "ratio", "upload", "cli"]
license = "MIT"
description = "CLI tool to fake your torrent upload in order to increase your ratio."

[dependencies]
fastrand = "2.5"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53", features = ["full"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
once_cell = "1.21"
sanitize-filename = "0.6"
url = "2.5.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "charset", "http2"] }
fake-torrent-client = "0.9.10"

xdg = "3.0"
toml-span = "0.7"

# logging
tracing = "0.1.41"
tracing-subscriber = "0.3"

# bittorrent parsing
sha1_smol = "1.0"

# file watching
notify = "8.0"

dashmap = "6.2.1"

[dev-dependencies]
tempfile = "3"
