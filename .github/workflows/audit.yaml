name: Dependency Security Audit

on:
  schedule:
    - cron: '22 0 * * *'
  workflow_dispatch: # allow to run manually
  pull_request: # Optional, can be heavy if a lot of PR
    branches:
      - main
      - master

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      # cargo-deny reads the same RustSec advisory DB as cargo-audit, and also
      # checks licenses, banned crates and sources in the same pass.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny
        run: cargo deny check
